<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>NxoraAI - Neural Assistant</title>
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=Outfit:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
    
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/styles/github-dark.min.css" />
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/highlight.min.js"></script>
    <script src="qrc:///qtwebchannel/qwebchannel.js"></script>
    
    <style>
        :root {
            /* Cinematic Glass Dark Theme */
            --bg-dark: #070913;
            --bg-grad: radial-gradient(circle at 50% 15%, #0f142f 0%, #05060b 80%);
            --accent-green: #10b981;
            --accent-green-glow: rgba(16, 185, 129, 0.25);
            --accent-blue: #38bdf8;
            --accent-blue-glow: rgba(56, 189, 248, 0.25);
            --text-main: #f8fafc;
            --text-muted: #64748b;
            
            --border-color: rgba(255, 255, 255, 0.05);
            --border-color-strong: rgba(255, 255, 255, 0.1);
            --surface: rgba(255, 255, 255, 0.03);
            --surface-hover: rgba(255, 255, 255, 0.06);
            
            --msg-ai-bg: rgba(16, 185, 129, 0.02);
            --msg-user-bg: rgba(255, 255, 255, 0.03);
            --msg-ai-border: rgba(16, 185, 129, 0.15);
            --msg-user-border: rgba(255, 255, 255, 0.06);
            
            --input-bg: rgba(255, 255, 255, 0.04);
            --shadow-glass: 0 10px 40px rgba(0, 0, 0, 0.5);
            
            --code-header-bg: #090d16;
            --code-bg: #03050a;
        }

        .light-theme {
            /* Clean Light Theme */
            --bg-dark: #f8fafc;
            --bg-grad: radial-gradient(circle at 50% 15%, #e0f2fe 0%, #f8fafc 80%);
            --accent-green: #059669;
            --accent-green-glow: rgba(5, 150, 105, 0.15);
            --accent-blue: #0284c7;
            --accent-blue-glow: rgba(2, 132, 199, 0.15);
            --text-main: #0f172a;
            --text-muted: #64748b;
            
            --border-color: rgba(15, 23, 42, 0.06);
            --border-color-strong: rgba(15, 23, 42, 0.12);
            --surface: rgba(15, 23, 42, 0.02);
            --surface-hover: rgba(15, 23, 42, 0.05);
            
            --msg-ai-bg: rgba(5, 150, 105, 0.02);
            --msg-user-bg: rgba(15, 23, 42, 0.03);
            --msg-ai-border: rgba(5, 150, 105, 0.15);
            --msg-user-border: rgba(15, 23, 42, 0.06);
            
            --input-bg: rgba(15, 23, 42, 0.03);
            --shadow-glass: 0 10px 40px rgba(148, 163, 184, 0.15);
            
            --code-header-bg: #f1f5f9;
            --code-bg: #ffffff;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            -webkit-font-smoothing: antialiased;
        }

        html, body {
            width: 100%;
            height: 100%;
            background: var(--bg-dark);
            background-image: var(--bg-grad);
            font-family: 'Inter', system-ui, sans-serif;
            color: var(--text-main);
            overflow: hidden;
        }

        /* Scrollbar */
        ::-webkit-scrollbar { width: 5px; height: 5px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb {
            background: rgba(148, 163, 184, 0.2);
            border-radius: 10px;
        }
        ::-webkit-scrollbar-thumb:hover { background: var(--accent-green); }

        /* Layout */
        .app-container {
            display: flex;
            width: 100%;
            height: 100%;
        }

        /* ─── LEFT SIDEBAR ─── */
        .sidebar {
            width: 300px;
            background: rgba(3, 5, 11, 0.4);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border-right: 1px solid var(--border-color);
            display: flex;
            flex-direction: column;
            flex-shrink: 0;
            padding: 24px 20px;
            z-index: 20;
            box-shadow: 5px 0 25px rgba(0,0,0,0.15);
        }

        .sb-brand {
            font-family: 'Outfit', sans-serif;
            font-size: 24px;
            font-weight: 800;
            color: var(--text-main);
            letter-spacing: -0.5px;
            margin-bottom: 24px;
            display: flex;
            align-items: center;
            gap: 2px;
        }
        .sb-brand span { color: var(--accent-green); }

        /* Vitals Widget */
        .vitals-dashboard {
            background: var(--surface);
            border: 1px solid var(--border-color-strong);
            border-radius: 14px;
            padding: 16px;
            margin-bottom: 24px;
        }
        .vitals-title {
            font-size: 11px;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 1.5px;
            color: var(--text-muted);
            margin-bottom: 12px;
            display: flex;
            align-items: center;
            gap: 6px;
        }
        .vital-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 13px;
            font-family: 'JetBrains Mono', monospace;
            margin-bottom: 6px;
        }
        .vital-label { color: var(--text-muted); }
        .vital-val { color: var(--accent-green); font-weight: 600; }
        .vital-bar-bg {
            height: 4px;
            background: rgba(255,255,255,0.06);
            border-radius: 2px;
            overflow: hidden;
            margin-bottom: 12px;
        }
        .vital-bar-fill {
            height: 100%;
            background: var(--accent-green);
            box-shadow: 0 0 8px var(--accent-green-glow);
            transition: width 1s ease;
        }

        /* Shortcuts Group */
        .sb-history-title {
            font-size: 11px;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 1.5px;
            color: var(--text-muted);
            margin-bottom: 12px;
        }
        .shortcut-group {
            display: flex;
            flex-direction: column;
            gap: 10px;
            flex: 1;
            overflow-y: auto;
            margin-bottom: 16px;
        }
        .shortcut-btn {
            background: var(--surface);
            border: 1px solid var(--border-color);
            color: var(--text-main);
            padding: 12px 14px;
            border-radius: 10px;
            font-size: 13px;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 10px;
            font-weight: 500;
            transition: all 0.2s ease;
            text-align: left;
        }
        .shortcut-btn:hover {
            background: var(--surface-hover);
            border-color: var(--accent-green);
            transform: translateY(-1px);
        }
        .shortcut-btn i {
            color: var(--accent-green);
            font-size: 15px;
            width: 18px;
            text-align: center;
        }
        .live-tag {
            background: #ef4444;
            color: #fff;
            font-size: 7px;
            padding: 1px 4px;
            border-radius: 3px;
            font-weight: 800;
            letter-spacing: 0.5px;
            animation: pulseFade 1s infinite alternate;
        }
        @keyframes pulseFade { 0% { opacity: 0.5; } 100% { opacity: 1; } }

        .sidebar-footer {
            border-top: 1px solid var(--border-color);
            padding-top: 16px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        /* ─── MAIN CONTENT ─── */
        .main-content {
            flex: 1;
            display: flex;
            flex-direction: column;
            overflow: hidden;
            position: relative;
        }

        /* Top Header Bar */
        .header-bar {
            height: 64px;
            border-bottom: 1px solid var(--border-color);
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 28px;
            background: rgba(7, 9, 19, 0.2);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            z-index: 10;
        }
        
        .header-left {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        /* Elegant Core Orb */
        .core-container {
            position: relative;
            width: 32px;
            height: 32px;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
        }
        .core-glow {
            position: absolute;
            width: 24px;
            height: 24px;
            background: radial-gradient(circle, var(--accent-green) 0%, transparent 70%);
            border-radius: 50%;
            opacity: 0.8;
            filter: blur(2px);
            animation: pulseGlow 2s ease-in-out infinite;
        }
        .orb-center {
            width: 12px;
            height: 12px;
            border-radius: 50%;
            background: var(--accent-green);
            box-shadow: 0 0 10px var(--accent-green);
            z-index: 2;
            transition: all 0.3s ease;
        }
        .ring {
            position: absolute;
            width: 100%;
            height: 100%;
            border-radius: 50%;
            border: 1px solid transparent;
            border-top-color: var(--accent-green);
            opacity: 0.4;
            animation: spin 3s linear infinite;
        }
        .ring:nth-child(2) {
            animation-duration: 2s;
            animation-direction: reverse;
            border-top-color: var(--accent-blue);
        }
        @keyframes spin { 100% { transform: rotate(360deg); } }
        @keyframes pulseGlow {
            0%, 100% { transform: scale(1); opacity: 0.5; }
            50% { transform: scale(1.25); opacity: 0.9; }
        }

        /* Orb States */
        .listening .orb-center { background: #ef4444; box-shadow: 0 0 12px #ef4444; transform: scale(1.15); }
        .listening .core-glow { background: radial-gradient(circle, #ef4444 0%, transparent 70%); }
        .listening .ring { border-top-color: #ef4444; }
        
        .processing .orb-center { background: #f59e0b; box-shadow: 0 0 12px #f59e0b; }
        .processing .core-glow { background: radial-gradient(circle, #f59e0b 0%, transparent 70%); }
        .processing .ring { border-top-color: #f59e0b; animation-duration: 1s !important; }

        .transcript-box {
            font-size: 13px;
            font-weight: 500;
            color: var(--text-muted);
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            max-width: 400px;
        }

        .header-right {
            font-family: 'Outfit', sans-serif;
            font-size: 12px;
            font-weight: 600;
            color: var(--text-muted);
            letter-spacing: 1px;
            text-transform: uppercase;
        }

        /* Chat Area */
        .chat-area {
            flex: 1;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        .chat-feed {
            flex: 1;
            overflow-y: auto;
            padding: 24px 40px;
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        /* Message Bubbles */
        .msg-row {
            display: flex;
            align-items: flex-start;
            gap: 12px;
            max-width: 80%;
        }
        .msg-row.ai { align-self: flex-start; }
        .msg-row.user { align-self: flex-end; flex-direction: row-reverse; }

        .avatar {
            width: 32px;
            height: 32px;
            border-radius: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
            font-size: 13px;
            margin-top: 4px;
        }
        .av-ai { background: var(--surface); color: var(--accent-green); border: 1px solid var(--border-color); }
        .av-user { background: var(--accent-green); color: #fff; }

        .msg-content { display: flex; flex-direction: column; gap: 4px; max-width: calc(100% - 44px); }
        .msg-name { font-size: 11px; font-weight: 700; color: var(--text-muted); margin-left: 2px; }
        .msg-row.user .msg-name { text-align: right; margin-right: 2px; }

        .bubble {
            padding: 12px 16px;
            border-radius: 16px;
            font-size: 14px;
            line-height: 1.55;
            white-space: pre-wrap;
            word-break: break-word;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
        }
        .bubble.ai {
            background: var(--msg-ai-bg);
            border: 1px solid var(--msg-ai-border);
            border-top-left-radius: 4px;
            color: var(--text-main);
        }
        .bubble.user {
            background: var(--msg-user-bg);
            border: 1px solid var(--msg-user-border);
            color: var(--text-main);
            border-top-right-radius: 4px;
        }

        /* Code Blocks */
        .code-wrap {
            margin-top: 10px;
            border-radius: 10px;
            overflow: hidden;
            border: 1px solid var(--border-color-strong);
        }
        .code-top {
            background: var(--code-header-bg);
            padding: 6px 14px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 11px;
            font-family: 'JetBrains Mono', monospace;
            color: var(--text-muted);
            border-bottom: 1px solid var(--border-color);
        }
        .copy-btn {
            background: var(--surface);
            border: 1px solid var(--border-color);
            border-radius: 4px;
            color: var(--text-muted);
            padding: 2px 8px;
            cursor: pointer;
            font-size: 10px;
            font-weight: 500;
            transition: all 0.2s;
        }
        .copy-btn:hover { color: var(--accent-green); border-color: var(--accent-green); }
        pre { margin: 0; }
        pre code {
            font-family: 'JetBrains Mono', monospace;
            font-size: 12.5px;
            line-height: 1.5;
            padding: 12px 14px !important;
            background: var(--code-bg) !important;
        }

        /* Typing Indicator */
        .typing-row { display: none; align-items: flex-start; gap: 12px; }
        .typing-row.show { display: flex; }
        .typing-bub {
            display: flex;
            gap: 5px;
            padding: 12px 16px;
            background: var(--msg-ai-bg);
            border: 1px solid var(--msg-ai-border);
            border-radius: 16px;
            border-top-left-radius: 4px;
            align-items: center;
            height: 40px;
        }
        .tdot {
            width: 5px;
            height: 5px;
            border-radius: 50%;
            background: var(--accent-green);
            animation: pulseDot 1.4s infinite;
        }
        .tdot:nth-child(2) { animation-delay: 0.2s; }
        .tdot:nth-child(3) { animation-delay: 0.4s; }
        @keyframes pulseDot {
            0%, 100% { opacity: 0.3; transform: scale(0.8); }
            50% { opacity: 1; transform: scale(1.1); }
        }

        /* Input Container */
        .input-area-container {
            padding: 0 40px 24px;
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        /* Quick Prompts */
        .quick-prompts-container {
            display: flex;
            gap: 8px;
            justify-content: center;
            flex-wrap: wrap;
            margin-bottom: 4px;
        }
        .qp-card {
            background: var(--surface);
            border: 1px solid var(--border-color);
            padding: 6px 14px;
            border-radius: 100px;
            cursor: pointer;
            font-size: 12px;
            font-weight: 500;
            color: var(--text-main);
            transition: all 0.2s ease;
            display: flex;
            align-items: center;
            gap: 6px;
        }
        .qp-card:hover {
            background: var(--surface-hover);
            border-color: var(--accent-green);
            transform: translateY(-1px);
        }
        .qp-card i { color: var(--accent-green); }

        /* Input capsule */
        .input-wrap {
            display: flex;
            align-items: center;
            gap: 10px;
            background: var(--input-bg);
            border: 1px solid var(--border-color-strong);
            border-radius: 28px;
            padding: 8px 12px 8px 16px;
            transition: all 0.3s ease;
            max-width: 720px;
            width: 100%;
            margin: 0 auto;
            box-shadow: var(--shadow-glass);
        }
        .input-wrap:focus-within {
            border-color: var(--accent-green);
            box-shadow: 0 0 15px rgba(16, 185, 129, 0.1), var(--shadow-glass);
        }

        .chat-ta {
            flex: 1;
            background: transparent;
            border: none;
            outline: none;
            font-family: inherit;
            font-size: 14px;
            color: var(--text-main);
            resize: none;
            min-height: 24px;
            max-height: 120px;
            line-height: 1.5;
            padding: 2px 0;
        }
        .chat-ta::placeholder { color: var(--text-muted); }

        .btn-mic-wrap { position: relative; display: flex; align-items: center; justify-content: center; }
        .btn-mic {
            width: 32px; height: 32px;
            border-radius: 50%;
            border: 1px solid var(--border-color);
            background: var(--surface);
            color: var(--text-muted);
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 13px;
            transition: all 0.2s ease;
        }
        .btn-mic:hover { color: var(--accent-green); border-color: var(--accent-green); }
        .btn-mic.active {
            background: #ef4444;
            color: #fff;
            border-color: #ef4444;
            animation: micPulse 1.2s infinite alternate;
        }
        @keyframes micPulse {
            0% { box-shadow: 0 0 4px rgba(239, 68, 68, 0.4); }
            100% { box-shadow: 0 0 12px rgba(239, 68, 68, 0.8); }
        }

        .btn-send {
            width: 32px; height: 32px;
            border-radius: 50%;
            background: var(--accent-green);
            color: #fff;
            border: none;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 13px;
            transition: all 0.2s ease;
            box-shadow: 0 4px 10px var(--accent-green-glow);
        }
        .btn-send:hover {
            transform: scale(1.05);
            box-shadow: 0 4px 15px rgba(16, 185, 129, 0.4);
        }

        /* ─── OVERLAYS ─── */
        .vital-extra-info {
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 12px;
            color: var(--text-muted);
            margin-top: 10px;
            border-top: 1px solid var(--border-color);
            padding-top: 10px;
        }
        .vital-extra-item {
            display: flex;
            align-items: center;
            gap: 4px;
        }
        .vital-battery-charging {
            color: var(--accent-green) !important;
            animation: pulse-glow 1.5s infinite alternate;
        }
        .vitals-apps-list {
            margin-top: 12px;
            border-top: 1px solid var(--border-color);
            padding-top: 10px;
        }
        .vitals-apps-title {
            font-size: 10px;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 1px;
            color: var(--text-muted);
            margin-bottom: 8px;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }
        .vital-app-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 11.5px;
            font-family: 'JetBrains Mono', monospace;
            padding: 4px 6px;
            background: rgba(255,255,255,0.02);
            border-radius: 6px;
            margin-bottom: 4px;
            border: 1px solid rgba(255,255,255,0.01);
            transition: all 0.2s ease;
        }
        .vital-app-item:hover {
            background: rgba(255,255,255,0.04);
            border-color: rgba(255,255,255,0.05);
        }
        .vital-app-name {
            color: var(--text-main);
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            max-width: 130px;
        }
        .vital-app-kill {
            background: transparent;
            border: none;
            color: var(--text-muted);
            cursor: pointer;
            font-size: 11px;
            padding: 2px 4px;
            border-radius: 4px;
            transition: all 0.2s ease;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .vital-app-kill:hover {
            color: #ef4444;
            background: rgba(239, 68, 68, 0.1);
        }
        @keyframes pulse-glow {
            0% { opacity: 0.6; filter: drop-shadow(0 0 1px var(--accent-green-glow)); }
            100% { opacity: 1; filter: drop-shadow(0 0 4px var(--accent-green-glow)); }
        }
    </style>
</head>

<body>

    <div class="app-container">

        <!-- LEFT SIDEBAR -->
        <aside class="sidebar">
            <div class="sb-brand">
                <div id="uiAppName">Nxora<span>AI</span></div>
            </div>

            <!-- CPU / RAM Vitals -->
            <div class="vitals-dashboard" id="vitalsDash">
                <div class="vitals-title"><i class="fa-solid fa-microchip"></i> Engine Vitals</div>
                
                <div class="vital-row">
                    <span class="vital-label">CPU Load</span>
                    <span class="vital-val" id="vitalCpuText">0%</span>
                </div>
                <div class="vital-bar-bg"><div class="vital-bar-fill" id="vitalCpuBar" style="width: 0%"></div></div>
                
                <div class="vital-row">
                    <span class="vital-label">RAM Active</span>
                    <span class="vital-val" id="vitalRamText">0.0 GB</span>
                </div>
                <div class="vital-bar-bg"><div class="vital-bar-fill" id="vitalRamBar" style="width: 0%"></div></div>
                
                <div class="vital-extra-info">
                    <div class="vital-extra-item" title="System Uptime">
                        <i class="fa-solid fa-clock"></i>
                        <span id="vitalUptime">--</span>
                    </div>
                    <div class="vital-extra-item" title="Battery Status">
                        <i class="fa-solid fa-battery-three-quarters" id="vitalBatteryIcon"></i>
                        <span id="vitalBatteryText">--%</span>
                    </div>
                </div>

                <div class="vitals-apps-list">
                    <div class="vitals-apps-title">
                        <span>Active User Apps</span>
                        <i class="fa-solid fa-list-check"></i>
                    </div>
                    <div id="vitalsAppsContainer">
                        <div style="font-size:10px; color:var(--text-muted); font-style:italic;">Scanning...</div>
                    </div>
                </div>
            </div>

            <div class="sb-history-title">Quick Actions</div>

            <div class="shortcut-group">
                <button class="shortcut-btn" onclick="toggleTheme()" id="themeBtn">
                    <i class="fa-solid fa-sun" id="themeIcon"></i> Toggle Theme
                </button>
                <button class="shortcut-btn" onclick="sendShortcut('Run System Diagnostic')">
                    <i class="fa-solid fa-laptop-medical"></i> System Diagnostic
                </button>
                <button class="shortcut-btn" onclick="sendShortcut('Test Local Network Speed')">
                    <i class="fa-solid fa-wifi"></i> Network Speed Test
                </button>
                <button class="shortcut-btn" onclick="sendShortcut('What is the weather today?')">
                    <i class="fa-solid fa-cloud-sun"></i> Weather Report
                </button>
                <button class="shortcut-btn" onclick="sendShortcut('Open Notepad')">
                    <i class="fa-regular fa-file-lines"></i> Open Notepad
                </button>
                <button class="shortcut-btn" onclick="sendShortcut('Take a screenshot')">
                    <i class="fa-solid fa-camera"></i> Take Screenshot
                </button>
            </div>

            <div class="sidebar-footer">
                <span style="font-size:11px; color:var(--text-muted);">Session Cache</span>
                <button class="copy-btn" onclick="clearSession()" title="Reset Conversation">
                    <i class="fa-solid fa-trash-can" style="margin-right:4px"></i> Clear Chat
                </button>
            </div>
        </aside>

        <!-- MAIN AREA -->
        <main class="main-content">
            
            <!-- Top Status Bar -->
            <header class="header-bar">
                <div class="header-left">
                    <div class="core-container" id="energyCore">
                        <div class="core-glow"></div>
                        <div class="ring"></div>
                        <div class="ring"></div>
                        <div class="orb-center"></div>
                    </div>
                    <div class="transcript-box" id="transcriptBox">
                        <span id="transcriptText">Standby...</span>
                    </div>
                </div>
                <div class="header-right" id="uiAppSub">
                    NxoraAI Engine 2026
                </div>
            </header>

            <!-- Chat Area -->
            <div class="chat-area">
                <div class="chat-feed" id="chatFeed">
                    <div class="msg-row ai" id="welcomeMsg">
                        <div class="avatar av-ai"><i class="fa-solid fa-bolt"></i></div>
                        <div class="msg-content">
                            <div class="msg-name" id="uiMsgName">NxoraAI</div>
                            <div class="bubble ai" id="uiWelcome">Hello! I am NxoraAI. Ask me anything directly right here.</div>
                        </div>
                    </div>

                    <div class="typing-row" id="typingRow">
                        <div class="avatar av-ai"><i class="fa-solid fa-bolt"></i></div>
                        <div class="msg-content">
                            <div class="msg-name" id="uiTypingName">NxoraAI</div>
                            <div class="typing-bub">
                                <div class="tdot"></div>
                                <div class="tdot"></div>
                                <div class="tdot"></div>
                            </div>
                        </div>
                    </div>
                </div>

                <!-- Input area container -->
                <div class="input-area-container">
                    
                    <!-- Quick Prompts Chips Floating Above Input Box -->
                    <div class="quick-prompts-container" id="quickPrompts">
                        <div class="qp-card" onclick="triggerQuickPrompt('Write a python script to scan my network')">
                            <i class="fa-brands fa-python"></i> Network Scanner
                        </div>
                        <div class="qp-card" onclick="triggerQuickPrompt('Run System Diagnostic')">
                            <i class="fa-solid fa-laptop-medical"></i> System Diag
                        </div>
                        <div class="qp-card" onclick="triggerQuickPrompt('Scan workspace')">
                            <i class="fa-solid fa-folder-open"></i> Scan Workspace
                        </div>
                        <div class="qp-card" onclick="triggerQuickPrompt('Summarize the latest AI news in 3 bullet points')">
                            <i class="fa-regular fa-newspaper"></i> Tech News
                        </div>
                    </div>

                    <!-- Floating input box capsule -->
                    <div class="input-wrap">
                        <div class="btn-mic-wrap" id="micWrapper">
                            <div class="mic-aura"></div>
                            <button class="btn-mic" onclick="toggleVoice()" id="micBtn" title="Voice Input">
                                <i class="fa-solid fa-microphone"></i>
                            </button>
                        </div>
                        
                        <textarea id="chatInput" class="chat-ta" placeholder="Send a message..." rows="1"></textarea>
                        
                        <button class="btn-send" onclick="submitChat()" title="Send">
                            <i class="fa-solid fa-arrow-up"></i>
                        </button>
                    </div>
                </div>
            </div>


        </main>

    </div>

    <script>
        /* ─── CONFIGURATION LOADER ─── */
        let appConfig = {
            assistant_name: "Nxora",
            assistant_version: "2026",
            primary_color: "#4ade80"
        };
        
        function displayError(msg) {
            console.error(msg);
            const transcriptBox = document.getElementById('transcriptText');
            if (transcriptBox) {
                transcriptBox.innerHTML = `<span style="color: #ef4444;"><i class="fa-solid fa-triangle-exclamation"></i> Error: ${msg}</span>`;
                setTimeout(() => {
                    if (transcriptBox.innerText.includes('Error:')) {
                        transcriptBox.innerText = "Standby...";
                    }
                }, 5000);
            }
        }
        
        window.addEventListener('error', e => {
            if (e.message) {
                console.error("Caught UI Error: ", e.message);
                displayError(e.message);
            }
        });

        window.injectConfig = function(configStr) {
            try {
                const data = JSON.parse(configStr);
                appConfig = { ...appConfig, ...data };
                applyConfigToUI();
            } catch (e) {
                console.error("Using default config due to parsing exception:", e);
                applyConfigToUI();
            }
        };

        function applyConfigToUI() {
            try {
                if (document.getElementById('uiAppName')) document.getElementById('uiAppName').innerHTML = `${appConfig.assistant_name}<span>AI</span>`;
                if (document.getElementById('uiAppSub')) document.getElementById('uiAppSub').innerText = `${appConfig.assistant_name} Engine ${appConfig.assistant_version}`;
                if (document.getElementById('uiMsgName')) document.getElementById('uiMsgName').innerText = appConfig.assistant_name;
                if (document.getElementById('uiWelcome')) document.getElementById('uiWelcome').innerText = `Hello! I am ${appConfig.assistant_name}. Ask me anything directly right here.`;
                if (document.getElementById('uiTypingName')) document.getElementById('uiTypingName').innerText = appConfig.assistant_name;
                document.title = `${appConfig.assistant_name} - Neural Assistant`;
            } catch (e) {
                console.error("Error applying config to UI:", e);
            }
        }

        applyConfigToUI();

        /* ─── PYTHON BRIDGE ─── */
        window.backend = null;
        try {
            new QWebChannel(qt.webChannelTransport, function (ch) {
                console.log("[BRIDGE] Connected to Python backend");
                window.backend = ch.objects.backend;
            });
        } catch (e) {
            console.log("[BRIDGE] QWebChannel not found, mocking environment.");
        }

        function _send(t) {
            if (t && backend) {
                backend.receive_text(t);
            }
        }

        /* ─── VOICE LOGIC ─── */
        let isListening = false;
        const micWrapper = () => document.getElementById('micWrapper');
        const btnMic = () => document.getElementById('micBtn');
        const energyCore = () => document.getElementById('energyCore');
        const transcriptText = () => document.getElementById('transcriptText');
        const transcriptBox = () => document.getElementById('transcriptBox');
        const quickPrompts = () => document.getElementById('quickPrompts');

        function toggleVoice() {
            if (backend) {
                backend.trigger_voice();
            } else {
                isListening = !isListening;
                if (isListening) updateStatus('Listening...', 'listening');
                else updateStatus('Standby...', 'standby');
            }
        }

        /* ─── CHAT LOGIC ─── */
        const chatInput = document.getElementById('chatInput');
        chatInput.addEventListener('input', function () {
            this.style.height = 'auto';
            this.style.height = Math.min(this.scrollHeight, 120) + 'px';
        });
        chatInput.addEventListener('keydown', e => {
            if (e.key === 'Enter' && !e.shiftKey) {
                e.preventDefault();
                submitChat();
            }
        });

        function submitChat() {
            const txt = chatInput.value.trim();
            if (!txt) return;
            handleCommandInitiation(txt, false);
        }

        function sendShortcut(cmd) {
            handleCommandInitiation(cmd, false);
        }

        function triggerQuickPrompt(cmd) {
            handleCommandInitiation(cmd, true);
        }

        function handleCommandInitiation(text, isInjection) {
            const qp = quickPrompts();
            if(qp && qp.style.display !== 'none') {
                gsap.to(qp, {opacity: 0, y: 10, duration: 0.2, onComplete: () => qp.style.display = 'none'});
            }
            
            appendMessage('You', text, '');
            _send(text);
            updateStatus('Processing...', 'processing');
            
            if(!isInjection){
                chatInput.value = '';
                chatInput.style.height = 'auto';
            }
        }

        function clearSession() {
            document.getElementById('chatFeed').innerHTML = `
                <div class="msg-row ai" id="welcomeMsg">
                    <div class="avatar av-ai"><i class="fa-solid fa-bolt"></i></div>
                    <div class="msg-content">
                        <div class="msg-name" id="uiMsgName">${appConfig.assistant_name}</div>
                        <div class="bubble ai" id="uiWelcome">Hello! I am ${appConfig.assistant_name}. Ask me anything directly right here.</div>
                    </div>
                </div>
                <div class="typing-row" id="typingRow">
                    <div class="avatar av-ai"><i class="fa-solid fa-bolt"></i></div>
                    <div class="msg-content">
                        <div class="msg-name" id="uiTypingName">${appConfig.assistant_name}</div>
                        <div class="typing-bub">
                            <div class="tdot"></div><div class="tdot"></div><div class="tdot"></div>
                        </div>
                    </div>
                </div>
            `;
            const tt = transcriptText();
            if(tt) tt.textContent = "Standby...";
            
            const qp = quickPrompts();
            if(qp) {
                qp.style.display = 'flex';
                gsap.fromTo(qp, {opacity: 0, y: 10}, {opacity: 1, y: 0, duration: 0.3});
            }
        }

        /* ─── APPEND MESSAGE (From Python) ─── */
        window.appendMessage = function(sender, text, colorOrType) {
            if (colorOrType === 'system') return;
            
            const qp = quickPrompts();
            if(qp && qp.style.display !== 'none' && sender !== appConfig.assistant_name) {
                gsap.to(qp, {opacity: 0, y: 10, duration: 0.2, onComplete: () => qp.style.display = 'none'});
            }

            text = text || "";
            const isUser = (sender === 'You');

            // Update Status bar text
            const tt = transcriptText();
            if(tt) {
                let shortText = text.length > 80 ? text.slice(0, 80) + '...' : text;
                tt.innerHTML = isUser ? `"${shortText}"` : `<span style="color:var(--accent-green)">${shortText}</span>`;
            }

            // Create Bubble
            const feed = document.getElementById('chatFeed');
            const typingRow = document.getElementById('typingRow');

            const row = document.createElement('div');
            row.className = `msg-row ${isUser ? 'user' : 'ai'}`;

            const av = document.createElement('div');
            av.className = `avatar ${isUser ? 'av-user' : 'av-ai'}`;
            av.innerHTML = isUser ? '<i class="fa-regular fa-user"></i>' : '<i class="fa-solid fa-bolt"></i>';

            const msgContent = document.createElement('div');
            msgContent.className = 'msg-content';

            const msgName = document.createElement('div');
            msgName.className = 'msg-name';
            msgName.textContent = isUser ? 'You' : appConfig.assistant_name;

            const bub = document.createElement('div');
            bub.className = `bubble ${isUser ? 'user' : 'ai'}`;

            if (!isUser && text.includes('```')) {
                const parts = text.split('```');
                for (let i = 0; i < parts.length; i++) {
                    if (i % 2 === 1) {
                        const lines = parts[i].split('\n');
                        const lang = lines[0].trim() || 'code';
                        const code = (lang !== 'code' && lines.length > 1 ? lines.slice(1) : lines).join('\n').trim();
                        
                        const wrap = document.createElement('div'); wrap.className = 'code-wrap';
                        const top = document.createElement('div'); top.className = 'code-top';
                        const ls = document.createElement('span'); ls.textContent = lang.toUpperCase();
                        const cb = document.createElement('button'); cb.className = 'copy-btn';
                        cb.innerHTML = 'Copy';
                        cb.onclick = () => { navigator.clipboard.writeText(code); cb.innerHTML = 'Copied!'; setTimeout(() => cb.innerHTML = 'Copy', 2000); };
                        top.appendChild(ls); top.appendChild(cb);
                        
                        const pre = document.createElement('pre'); const cel = document.createElement('code');
                        cel.className = lang !== 'code' ? 'language-' + lang : '';
                        cel.textContent = code; pre.appendChild(cel); wrap.appendChild(top); wrap.appendChild(pre);
                        bub.appendChild(wrap); setTimeout(() => hljs.highlightElement(cel), 0);
                    } else if (parts[i].trim()) {
                        const sp = document.createElement('span'); sp.style.cssText = 'white-space:pre-wrap;display:block;margin-bottom:4px';
                        sp.textContent = parts[i]; bub.appendChild(sp);
                    }
                }
            } else {
                bub.textContent = text;
            }

            msgContent.appendChild(msgName);
            msgContent.appendChild(bub);

            row.appendChild(av);
            row.appendChild(msgContent);
            feed.insertBefore(row, typingRow);

            if (typeof gsap !== 'undefined') {
                gsap.fromTo(row, { opacity: 0, y: 15 }, { opacity: 1, y: 0, duration: 0.3, ease: 'power2.out' });
            }

            feed.appendChild(typingRow);
            scrollFeed();
        }

        function scrollFeed() {
            const feed = document.getElementById('chatFeed');
            setTimeout(() => feed.scrollTo({ top: feed.scrollHeight, behavior: 'smooth' }), 50);
        }

        /* ─── REAL SYSTEM VITALS ─── */
        window.updateVitals = function(data) {
            if (!data) return;
            
            // 1. CPU
            const cpu = data.cpu || 0;
            const vitalCpuText = document.getElementById('vitalCpuText');
            const vitalCpuBar = document.getElementById('vitalCpuBar');
            if (vitalCpuText) vitalCpuText.innerText = cpu + '%';
            if (vitalCpuBar) vitalCpuBar.style.width = cpu + '%';
            
            // 2. RAM
            const ramPct = data.ram_pct || 0;
            const ramUsed = data.ram_used || '0.0 GB';
            const ramTotal = data.ram_total || '16.0 GB';
            const vitalRamText = document.getElementById('vitalRamText');
            const vitalRamBar = document.getElementById('vitalRamBar');
            if (vitalRamText) vitalRamText.innerText = `${ramUsed} / ${ramTotal}`;
            if (vitalRamBar) vitalRamBar.style.width = ramPct + '%';
            
            // 3. Uptime
            const uptime = data.uptime || '0m';
            const vitalUptime = document.getElementById('vitalUptime');
            if (vitalUptime) vitalUptime.innerText = uptime;
            
            // 4. Battery
            const batteryPct = data.battery_pct !== undefined ? data.battery_pct : 100;
            const batteryPlugged = data.battery_plugged;
            const vitalBatteryText = document.getElementById('vitalBatteryText');
            const vitalBatteryIcon = document.getElementById('vitalBatteryIcon');
            
            if (vitalBatteryText) vitalBatteryText.innerText = batteryPct + '%';
            if (vitalBatteryIcon) {
                if (batteryPlugged) {
                    vitalBatteryIcon.className = 'fa-solid fa-bolt-lightning vital-battery-charging';
                    vitalBatteryIcon.title = 'Battery Charging / Plugged In';
                } else {
                    vitalBatteryIcon.title = 'Discharging';
                    if (batteryPct > 80) {
                        vitalBatteryIcon.className = 'fa-solid fa-battery-full';
                    } else if (batteryPct > 50) {
                        vitalBatteryIcon.className = 'fa-solid fa-battery-three-quarters';
                    } else if (batteryPct > 20) {
                        vitalBatteryIcon.className = 'fa-solid fa-battery-half';
                    } else {
                        vitalBatteryIcon.className = 'fa-solid fa-battery-quarter';
                        vitalBatteryIcon.style.color = '#ef4444';
                    }
                }
            }
            
            // 5. Active User Apps
            const apps = data.apps || [];
            const container = document.getElementById('vitalsAppsContainer');
            if (container) {
                if (apps.length === 0) {
                    container.innerHTML = `<div style="font-size:10px; color:var(--text-muted); font-style:italic;">No user apps active.</div>`;
                } else {
                    let html = '';
                    apps.forEach(app => {
                        html += `
                        <div class="vital-app-item">
                            <span class="vital-app-name" title="${app.name} (${app.raw_name})">${app.name}</span>
                            <button class="vital-app-kill" onclick="killApp('${app.raw_name}')" title="Kill ${app.name}">
                                <i class="fa-solid fa-xmark"></i>
                            </button>
                        </div>`;
                    });
                    container.innerHTML = html;
                }
            }
        };

        function killApp(rawName) {
            if (window.backend && typeof window.backend.receive_text === 'function') {
                window.backend.receive_text('kill all ' + rawName);
            }
        }

        /* ─── STATUS UPDATES ─── */
        window.updateStatus = function(statusText, colorConfig) {
            const mw = micWrapper();
            const ec = energyCore();
            const bm = btnMic();
            const tt = transcriptText();
            const tr = document.getElementById('typingRow');

            if(mw) mw.classList.remove('listening');
            if(ec) ec.classList.remove('processing');
            if(tr) tr.classList.remove('show');
            if(bm) bm.classList.remove('active');

            if(tt) {
                tt.textContent = statusText;

                if (colorConfig === 'listening') {
                    if(mw) mw.classList.add('listening');
                    if(bm) bm.classList.add('active');
                    isListening = true;
                }
                else if (colorConfig === 'processing') {
                    if(ec) ec.classList.add('processing');
                    if(tr) tr.classList.add('show');
                    isListening = false;
                    scrollFeed();
                }
                else if (colorConfig === 'online' || colorConfig === 'standby') {
                    isListening = false;
                }
            }
        }



        /* ─── UI THEME SWITCHER ─── */
        function toggleTheme() {
            document.body.classList.toggle('light-theme');
            const isLight = document.body.classList.contains('light-theme');
            const icon = document.getElementById('themeIcon');
            if (isLight) {
                icon.className = 'fa-solid fa-moon';
            } else {
                icon.className = 'fa-solid fa-sun';
            }
        }

        window.onerror = function(msg, url, lineNo, columnNo, error) {
            const errStr = `[JS ERROR] ${msg} at ${lineNo}:${columnNo}`;
            if (window.backend) window.backend.receive_text(`!! JS ERROR: ${errStr}`);
            return false;
        };
    </script>
</body>
</html>
